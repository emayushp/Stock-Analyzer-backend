function Screener({dispatch}) {
  const [source,setSource] = useState("universe"); // "universe" | "highvolume"
  const [d,setD] = useState(null), [busy,setBusy] = useState(true), [err,setErr] = useState(null);
  const [hv,setHv] = useState(null), [hvBusy,setHvBusy] = useState(false), [hvErr,setHvErr] = useState(null);
  const [filter,setFilter] = useState("all");

  useEffect(()=>{
    let dead = false;
    api("/api/screener").then(j=>{ if(!dead) setD(j); })
      .catch(e=>{ if(!dead) setErr(e.message); })
      .finally(()=>{ if(!dead) setBusy(false); });
    return ()=>{ dead = true; };
  },[]);

  useEffect(()=>{
    if (source!=="highvolume" || hv || hvBusy) return;
    let dead = false;
    setHvBusy(true);
    api("/api/screener/high-volume").then(j=>{ if(!dead) setHv(j); })
      .catch(e=>{ if(!dead) setHvErr(e.message); })
      .finally(()=>{ if(!dead) setHvBusy(false); });
    return ()=>{ dead = true; };
  },[source]);

  const universeRows = d ? [
    ...(d.buy_candidates||[]).map(c=>({...c,signal:c.signal||"BUY"})),
    ...(d.sell_candidates||[]).map(c=>({...c,signal:c.signal||"SELL"})),
  ] : [];
  const rows = source==="highvolume" ? (hv?.stocks||[]) : universeRows;
  const filtered = filter==="all" ? rows : rows.filter(r=>r.signal===filter.toUpperCase());
  const activeBusy = source==="highvolume" ? hvBusy : busy;
  const activeErr = source==="highvolume" ? hvErr : err;
  const note = source==="highvolume" ? hv?.universe_note : d?.universe_note;

  return <>
    <div style={{margin:"22px 0 16px"}}><h1>Screener</h1><div className="tag">Scanned candidates · buy & sell signals</div></div>

    <div className="chips" style={{marginBottom:10}}>
      {[["universe","Fixed Universe"],["highvolume","🔥 High Volume"]].map(([k,l])=>
        <div key={k} className={"chip"+(source===k?" on":"")} onClick={()=>setSource(k)}>{l}</div>)}
    </div>

    {activeBusy && <Spin t={source==="highvolume" ? "Fetching today's most active tickers…" : "Scanning universe…"}/>}
    {activeErr && <div className="err"><b>Couldn't load screener</b>{activeErr}</div>}
    {!activeBusy && !activeErr && (source==="highvolume" ? hv : d) && <>
      {note && <p className="note" style={{marginTop:0}}>{note}</p>}
      <div className="chips" style={{marginTop:14}}>
        {[["all","All"],["buy","Buy"],["sell","Sell"]].map(([k,l])=>
          <div key={k} className={"chip"+(filter===k?" on":"")} onClick={()=>setFilter(k)}>{l}</div>)}
      </div>
      {filtered.length===0 ? <div className="center"><h3>No candidates</h3><p>Nothing matches this filter right now.</p></div> :
        <div className="card">
          {filtered.map(c=>{
            const sc = SIG[c.signal] || "var(--amber)";
            return <div className="srow" key={c.ticker} onClick={()=>dispatch({type:"analyze", ticker:c.ticker})}>
              <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
                <div className="dot" style={{background:sc,marginTop:0}}/>
                <div>
                  <b className="num">{c.ticker}</b>
                  <div className="meta">RSI {c.rsi ?? "—"} · Vol {c.volume_ratio!=null?c.volume_ratio+"×":"—"}</div>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="num">{c.price ?? "—"}</div>
                {c.change_pct!=null && <div className="num" style={{fontSize:11,color:c.change_pct>=0?"var(--green)":"var(--red)"}}>{pct(c.change_pct)}</div>}
              </div>
            </div>;
          })}
        </div>}
      {source==="universe" ? (
        <p className="center" style={{fontSize:11,padding:"10px 0"}}>
          Scanned {d.scanned_count ?? "—"} tickers{d.generated_at?` · ${new Date(d.generated_at).toLocaleString()}`:""}{d.cached?" · cached":""}
        </p>
      ) : (
        <p className="center" style={{fontSize:11,padding:"10px 0"}}>
          {hv.stocks.length} tickers{hv.generated_at?` · ${new Date(hv.generated_at).toLocaleString()}`:""}{hv.cached?" · cached":""}
        </p>
      )}
    </>}
  </>;
}

/* ===== Learn — Stocks 101, plain-English accordion ===== */
const LEARN_SECTIONS = [
  {t:"What is a stock?", b:"A share of stock is a tiny slice of ownership in a company. Its price is simply whatever a buyer and seller last agreed it's worth — not a fixed value set by the company. That's why the same stock can trade at different prices minute to minute, even if nothing about the actual business changed."},
  {t:"What actually moves the price?", b:"In the short term: supply and demand — more buyers than sellers pushes price up, and vice versa. What drives that demand includes earnings reports, news, interest rates, sector trends, and plain sentiment. In the long term, price tends to track the company's actual profits and growth. Short-term moves and long-term value can disagree for a long time before they converge."},
  {t:"Technical analysis, in plain English", b:"Technical analysis studies price and volume patterns to gauge momentum — the idea being that crowd behavior leaves visible fingerprints on a chart. RSI measures how fast a price has moved recently. MACD compares a fast vs. slow moving average to gauge whether momentum is accelerating or fading. Volume shows how many people are actually behind a move. All of them describe what already happened, not what will happen next."},
  {t:"Why volume matters", b:"A price move on heavy volume means lots of people participated — there's real conviction behind it. The same move on light volume can be noise, easily reversed. That's why this app reports volume as a separate conviction rating rather than folding it into Buy/Sell: volume tells you how much to trust a signal, not which direction it points."},
  {t:"Reading fundamentals", b:"Market cap is the company's total value. P/E ratio compares price to earnings — a rough gauge of whether a stock is expensive relative to what it actually earns, though \"high\" varies wildly by industry. Beta measures how much the stock swings relative to the overall market: above 1 means more volatile, below 1 means steadier. The 52-week range shows where today's price sits versus the past year."},
  {t:"Why news sentiment matters", b:"Markets often react to how a story is perceived before the real business impact is known — a single bad headline can move a price in minutes. This app runs recent headlines through FinBERT, an AI model trained specifically on financial language, so it understands that \"beats estimates\" is bullish and \"misses guidance\" is bearish in ways a general model wouldn't. Still, five headlines are a small sample."},
  {t:"Risk management 101", b:"A stop-loss caps how much you're willing to lose if a trade goes wrong. A take-profit defines what \"it worked\" looks like. The ratio between them — reward-to-risk — tells you how much you stand to gain versus what you're risking. A 2:1 ratio means you can be wrong more often than you're right and still come out ahead, which is why traders often care more about that ratio than about being right."},
  {t:"What this app doesn't do", b:"It doesn't evaluate whether a business is actually healthy (revenue trends, debt, competitive position), doesn't account for macroeconomic conditions, and doesn't know your personal financial situation or risk tolerance. It combines narrow signals mechanically. Useful as one input among many — not a substitute for research, and nothing here is financial advice."},
];

function Learn() {
  const [open,setOpen] = useState({0:true});
  return <>
    <div style={{margin:"22px 0 16px"}}><h1>Learn</h1><div className="tag">Stocks 101 · plain-English basics</div></div>
    {LEARN_SECTIONS.map((s,i)=>{
      const o = !!open[i];
      return <div key={i} className="card" style={{borderColor:o?"rgba(79,168,130,.27)":"var(--border)",cursor:"pointer"}}
        onClick={()=>setOpen({...open,[i]:!o})}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <b style={{fontSize:14}}>{s.t}</b>
          <span style={{fontSize:14,color:o?"var(--green)":"var(--faint)"}}>{o?"▲":"▼"}</span>
        </div>
        {o && <p className="mut" style={{marginTop:8,lineHeight:1.55}}>{s.b}</p>}
      </div>;
    })}
  </>;
}

/* ===== Settings ===== */
function Settings() {
  const [risk,setRisk] = useState(()=>store.get("ma_risk_pct",1));
  const [currency,setCurrency] = useState(()=>store.get("ma_currency","CAD"));

  const setRiskP = r => { setRisk(r); store.set("ma_risk_pct", r); };
  const setCur = c => { setCurrency(c); store.set("ma_currency", c); };

  return <>
    <div style={{margin:"22px 0 16px"}}><h1>Settings</h1><div className="tag">Defaults for this device</div></div>
    <div className="card">
      <h2>Default risk per trade</h2>
      <p className="mut" style={{marginBottom:12}}>Sets the starting risk % in the position-sizing calculator on Analyze.</p>
      <div className="chips" style={{marginBottom:0}}>
        {[0.5,1,2,3].map(r=><div key={r} className={"chip"+(risk===r?" on":"")} onClick={()=>setRiskP(r)}>{r}%</div>)}
      </div>
    </div>
    <div className="card">
      <h2>Display currency</h2>
      <p className="mut" style={{marginBottom:12}}>Preferred currency for figures this app doesn't otherwise infer from the ticker itself.</p>
      <div className="chips" style={{marginBottom:0}}>
        {["CAD","USD"].map(c=><div key={c} className={"chip"+(currency===c?" on":"")} onClick={()=>setCur(c)}>{c}</div>)}
      </div>
    </div>
    <p className="note">Saved on this device only — nothing here is sent anywhere.</p>
  </>;
}

/* ===== Log decision modal ===== */
function LogModal({data, onSave, onClose}) {
  const [act,setAct] = useState(null), [note,setNote] = useState("");
  const t = data.technical_analysis;
  return <div className="modal" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="box">
      <h2>Log decision — {data.ticker}<button className="link" onClick={onClose}>✕</button></h2>
      <div style={{background:"var(--card)",borderRadius:10,padding:13,marginBottom:14}}>
        <div className="lbl">The app said</div>
        <b className="num" style={{color:SIG[t.signal],fontSize:15,display:"block",marginTop:5}}>
          {t.signal} · {t.conviction} conviction · {data.current_price}</b>
      </div>
      <div className="lbl">What did you do?</div>
      {[["bought","Bought","Opened or added to a position"],
        ["sold","Sold","Closed or trimmed a position"],
        ["held","Did nothing","No action taken"]].map(([k,l,h])=>
        <div key={k} className={"opt"+(act===k?" on":"")} onClick={()=>setAct(k)}>
          <b style={act===k?{color:"var(--accent)"}:{}}>{l}</b><span>{h}</span></div>)}
      {act && <div className="expbody" style={{marginTop:12}}>
        {agree(t.signal,act)==="followed" ? "This follows the app's signal."
          : agree(t.signal,act)==="overrode" ? "This goes against the app's signal — worth noting why."
          : "The app suggested something; you're not acting on it."}</div>}
      <div className="lbl" style={{margin:"16px 0 8px"}}>Why? (the most useful part)</div>
      <textarea rows="4" placeholder="What's your reasoning? Future you will want to know."
        value={note} onChange={e=>setNote(e.target.value)}/>
      <button className="btn" style={{width:"100%",marginTop:14}} onClick={()=>{
        if (!act) return alert("Pick what you actually did.");
        onSave({id:`${data.ticker}-${Date.now()}`,ticker:data.ticker,
          history:[{action:act, price:data.current_price, note:note.trim(),
            at:new Date().toISOString(), app_signal:t.signal, app_conviction:t.conviction}]});
      }}>Save to journal</button>
    </div>
  </div>;
}

/* ===== Root ===== */
function App() {
  const [tab,setTab] = useState("analyze");
  const [q,setQ] = useState("");
  const [data,setData] = useState(null), [busy,setBusy] = useState(false), [err,setErr] = useState(null);
  const [watchlist,setWatchlist] = useState(()=>store.get("ma_watchlist",[]));
  const [scanTickers,setScanTickers] = useState(()=>store.get("ma_scan_tickers",[]));
  const [holdings,setHoldings] = useState(()=>store.get("ma_portfolio",[]));
  const [cash,setCash] = useState(()=>store.get("ma_cash",0));
  const [journal,setJournal] = useState(()=>store.get("ma_journal",[]));
  const [activity,setActivity] = useState(()=>store.get("ma_activity",[]));
  const [portfolioValue,setPV] = useState(0);
  const [logOpen,setLogOpen] = useState(false);

  const setScanTickersPersist = useCallback(list => {
    setScanTickers(list); store.set("ma_scan_tickers", list);
  }, []);

  const analyze = useCallback(async sym => {
    const s = (sym||"").trim().toUpperCase();
    if (!s) return;
    setQ(s); setTab("analyze"); setBusy(true); setErr(null); setData(null);
    try { setData(await api(`/api/analyze/${encodeURIComponent(s)}`)); }
    catch(e){ setErr(e.message); } finally { setBusy(false); }
  },[]);

  const dispatch = useCallback(a => {
    switch(a.type){
      case "q": setQ(a.v); break;
      case "analyze": analyze(a.ticker); break;
      case "watch": { const n = watchlist.includes(a.ticker)?watchlist.filter(t=>t!==a.ticker):[...watchlist,a.ticker];
        setWatchlist(n); store.set("ma_watchlist",n); break; }
      case "holdings": setHoldings(a.v); store.set("ma_portfolio",a.v); break;
      case "cash": setCash(a.v); store.set("ma_cash",a.v); break;
      case "journal": setJournal(a.v); store.set("ma_journal",a.v); break;
      case "activity": setActivity(a.v); store.set("ma_activity",a.v); break;
      case "pv": setPV(a.v); break;
      case "logOpen": setLogOpen(true); break;
    }
  },[watchlist,analyze]);

  const state = {q,data,busy,err,watchlist,holdings,cash,journal,activity,portfolioValue,
    scanTickers,setScanTickers:setScanTickersPersist};

  return <>
    <header><div className="hdr">
      <div className="logo"><Logo/></div>
      <div><h1>Market Analyzer</h1><div className="tag">Measured signals · not predictions</div></div>
      <nav>{[["analyze","Analyze"],["portfolio","Portfolio"],["activity","Activity"],["brief","Brief"],["journal","Journal"],
        ["screener","Screener"],["learn","Learn"],["settings","Settings"]].map(([k,l])=>
        <button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{l}</button>)}</nav>
    </div></header>
    <div className="wrap">
      {tab==="analyze" && <Analyze state={state} dispatch={dispatch}/>}
      {tab==="portfolio" && <Portfolio state={state} dispatch={dispatch}/>}
      {tab==="activity" && <Activity state={state} dispatch={dispatch}/>}
      {tab==="brief" && <Brief state={state} dispatch={dispatch}/>}
      {tab==="journal" && <Journal state={state} dispatch={dispatch}/>}
      {tab==="screener" && <Screener state={state} dispatch={dispatch}/>}
      {tab==="learn" && <Learn state={state} dispatch={dispatch}/>}
      {tab==="settings" && <Settings state={state} dispatch={dispatch}/>}
    </div>
    {logOpen && data && <LogModal data={data} onClose={()=>setLogOpen(false)}
      onSave={e=>{ const n=[e,...journal]; setJournal(n); store.set("ma_journal",n); setLogOpen(false);
        alert("Saved to your journal. Check back in a couple of weeks to see how it turned out."); }}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
